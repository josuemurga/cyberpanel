<div class="display-flex-column flex-auto" i360Loader>
    <div class="card-container" *ngIf="isAvailable === true">
        <i360-header>
            {{ 'reputation.title' | translate }}
        </i360-header>
        <div class="flexer">
            <mat-icon svgIcon="shark" class="big-shark"></mat-icon>
            <div class="info">
                <p class="domains_number">{{ requestsState.infectedDomainsCount.cache|async }}</p>
                <p class="domain_text" translate>reputation.affectedDomains</p>
            </div>
        </div>

        <div class="reputation">
            <i360-data-view [i360-request]="reputationService.load">
                <i360-widget i360-paginator [simplePagination]="true"></i360-widget>
                <i360-widget i360-limit></i360-widget>
                <i360-table i360-main-view>
                    <i360-column headerText="reputation.headers.id" bodyField="username" classes="i360-vertical-align-top"></i360-column>
                    <i360-column headerText="reputation.headers.domain" bodyField="domain" classes="i360-vertical-align-top"></i360-column>
                    <i360-column headerText="reputation.headers.type" classes="i360-vertical-align-top">
                        <ng-template i360HostTemplate let-item>
                            <div *ngFor="let threat of item.threats"
                                 class="i360-nested-rows">
                                <i360-default-if-not-translated
                                        [key]="'reputation.threatType.' + threat.type">
                                    <ng-template #default>{{ defaultTranslation(threat.type) }}</ng-template>
                                </i360-default-if-not-translated>
                            </div>
                        </ng-template>
                    </i360-column>
                    <i360-column headerText="reputation.headers.vendor" classes="i360-vertical-align-top">
                        <ng-template i360HostTemplate let-item>
                            <ng-container *ngFor="let threat of item.threats">
                                <a *ngIf="!!threat.link; else noLink"
                                   class="i360-nested-rows i360-dashboard-link"
                                   target="_blank"
                                   [href]="threat.link">
                                    {{ threat.vendor }}
                                </a>
                                <ng-template #noLink>
                                    <span class="i360-nested-rows">{{ threat.vendor }}</span>
                                </ng-template>
                            </ng-container>
                        </ng-template>
                    </i360-column>
                    <i360-column headerText="reputation.headers.detectionTime" classes="i360-vertical-align-top">
                        <ng-template i360HostTemplate let-item>
                            <div *ngFor="let threat of item.threats" class="i360-nested-rows">
                                {{ threat.timestamp | dayjs: 'lll' }}
                            </div>
                        </ng-template>
                    </i360-column>
                    <i360-column headerText="reputation.headers.action" classes="i360-vertical-align-top">
                        <a *i360HostTemplate
                           class="i360-info-action"
                           [matTooltip]="'reputation.infoAction' | translate"
                           href="https://blog.imunify360.com/what-to-do-if-your-website-is-blacklisted"
                           target="_blank">
                            <mat-icon>info</mat-icon>
                        </a>
                    </i360-column>
                </i360-table>
            </i360-data-view>
        </div>
    </div>
    <upgrade-needed *ngIf="isAvailable === false"
                    title="upgradeNeeded.reputationManagementTitle"
                    description="upgradeNeeded.reputationManagement">
    </upgrade-needed>
</div>
