<mat-button-toggle-group name="ipVersion"
                         [value]="selected"
                         (valueChange)="selectedChange.emit($event)">
    <mat-button-toggle [value]="IP_VERSION.V4">{{ IP_VERSION.V4 }}</mat-button-toggle>
    <mat-button-toggle [value]="IP_VERSION.V6">{{ IP_VERSION.V6 }}</mat-button-toggle>
</mat-button-toggle-group>
