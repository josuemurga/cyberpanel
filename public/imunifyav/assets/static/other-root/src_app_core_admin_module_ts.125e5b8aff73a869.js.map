<div i360Loader *ngIf="!appState.csf">
    <div class="card-container settings-container">
        <form
            class="canvas i360-visible-save-button"
            [formGroup]="config.form"
            i360Config
            [automaticallySubmit]="false"
            [class.no-border]="config.form.value?.FIREWALL.port_blocking_mode === PortBlockingMode.allow"
            (i360Submit)="submit()"
            #config="i360Config">
            <div class="input_group no-border" formGroupName="FIREWALL">
                <i360-settings-field
                        inputTitle="{{ 'blockedPorts.defaultBlocking.title' | translate }}">
                    <mat-form-field>
                        <mat-select
                            formControlName="port_blocking_mode"
                            (valueChange)="onChangeBlockingMode($event)"
                            [placeholder]="'settings.malware.general.defaultAction.placeholder' | translate">
                            <mat-option *ngFor="let option of []" [value]="option.value">
                                {{option.title | translate}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </i360-settings-field>
            </div>
            <ng-container *ngIf="config.form.value?.FIREWALL.port_blocking_mode === PortBlockingMode.deny">
                <i360-ip-version-toggle class="blocked-ports-form__toggle_group" [(selected)]="selectedIpVersion">
                </i360-ip-version-toggle>
                <div [hidden]="selectedIpVersion === IP_VERSION.V6"
                     class="input_group no-border"
                     data-element="IPv4-blocked-ports-form"
                     formGroupName="FIREWALL">
                    <i360-settings-field
                        description="{{ 'blockedPorts.tcpInbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                        inputTitle="{{ 'blockedPorts.tcpInbound.title' | translate }}">
                        <cl-text-input >
                            <textarea
                                matInput
                                cdkTextareaAutosize
                                cdkAutosizeMinRows="2"
                                cdkAutosizeMaxRows="7"
                                commaSeparatedInput
                                formControlName="TCP_IN_IPv4"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                        description="{{ 'blockedPorts.tcpOutbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                        inputTitle="{{ 'blockedPorts.tcpOutbound.title' | translate }}">
                        <cl-text-input >
                            <textarea
                                matInput
                                cdkTextareaAutosize
                                cdkAutosizeMinRows="2"
                                cdkAutosizeMaxRows="7"
                                commaSeparatedInput
                                formControlName="TCP_OUT_IPv4"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                        description="{{ 'blockedPorts.udpInbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                        inputTitle="{{ 'blockedPorts.udpInbound.title' | translate }}">
                        <cl-text-input>
                            <textarea
                                matInput
                                cdkTextareaAutosize
                                cdkAutosizeMinRows="2"
                                cdkAutosizeMaxRows="7"
                                commaSeparatedInput
                                formControlName="UDP_IN_IPv4"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                        inputTitle="{{ 'blockedPorts.udpOutbound.title' | translate }}"
                        description="{{ 'blockedPorts.udpOutbound.description' | translate: {ipVersion: selectedIpVersion} }}">
                        <cl-text-input>
                            <textarea
                                matInput
                                cdkTextareaAutosize
                                cdkAutosizeMinRows="2"
                                cdkAutosizeMaxRows="7"
                                commaSeparatedInput
                                formControlName="UDP_OUT_IPv4"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                </div>

                <div [hidden]="selectedIpVersion === IP_VERSION.V4"
                     class="input_group no-border"
                     data-element="IPv6-blocked-ports-form"
                     formGroupName="FIREWALL">
                    <i360-settings-field
                            description="{{ 'blockedPorts.tcpInbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                            inputTitle="{{ 'blockedPorts.tcpInbound.title' | translate }}">
                        <cl-text-input >
                            <textarea
                                    matInput
                                    cdkTextareaAutosize
                                    cdkAutosizeMinRows="2"
                                    cdkAutosizeMaxRows="7"
                                    commaSeparatedInput
                                    formControlName="TCP_IN_IPv6"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                            description="{{ 'blockedPorts.tcpOutbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                            inputTitle="{{ 'blockedPorts.tcpOutbound.title' | translate }}">
                        <cl-text-input >
                            <textarea
                                    matInput
                                    cdkTextareaAutosize
                                    cdkAutosizeMinRows="2"
                                    cdkAutosizeMaxRows="7"
                                    commaSeparatedInput
                                    formControlName="TCP_OUT_IPv6"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                            description="{{ 'blockedPorts.udpInbound.description' | translate: {ipVersion: selectedIpVersion} }}"
                            inputTitle="{{ 'blockedPorts.udpInbound.title' | translate }}">
                        <cl-text-input>
                            <textarea
                                    matInput
                                    cdkTextareaAutosize
                                    cdkAutosizeMinRows="2"
                                    cdkAutosizeMaxRows="7"
                                    commaSeparatedInput
                                    formControlName="UDP_IN_IPv6"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                    <i360-settings-field
                            inputTitle="{{ 'blockedPorts.udpOutbound.title' | translate }}"
                            description="{{ 'blockedPorts.udpOutbound.description' | translate: {ipVersion: selectedIpVersion} }}">
                        <cl-text-input>
                            <textarea
                                    matInput
                                    cdkTextareaAutosize
                                    cdkAutosizeMinRows="2"
                                    cdkAutosizeMaxRows="7"
                                    commaSeparatedInput
                                    formControlName="UDP_OUT_IPv6"
                            ></textarea>
                        </cl-text-input>
                    </i360-settings-field>
                </div>

                <div class="tools">
                    <button color="primary" mat-raised-button>
                        {{ 'blockedPorts.submit' | translate }}
                    </button>
                </div>
            </ng-container>
        </form>
    </div>
    <i360-blocked-ports *ngIf="(i360Config.changes|async)?.FIREWALL.port_blocking_mode === PortBlockingMode.allow && config.form.value?.FIREWALL.port_blocking_mode === PortBlockingMode.allow"></i360-blocked-ports>
</div>
<i360-csf-warning
        listName="blocked_ports"
        *ngIf="appState.csf">
</i360-csf-warning>
