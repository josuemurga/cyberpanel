<a *ngIf="country?.code"
    class="country-cell-link"
    [routerLink]="[]"
    (click)="$event.stopPropagation()"
    [queryParams]="{'by_country_code': country?.code}">
    <img placement="right"
         class="country-icon"
         [matTooltip]="countryName"
         [attr.aria-label]="countryName"
         [src]="flagsPath + country?.code + '.png'">
</a>
