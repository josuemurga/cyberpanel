<div class="card-container">
    <div *ngIf="purchaseUrl" class="patch-all-banner">
        <div class="patch-all-banner__container">
            <mat-icon svgIcon="shield-gray" class="patch-all-banner__icon">
            </mat-icon>
            <div class="patch-all-banner__shield-marker">{{  'imunifyPatch.banner.off' | translate }}
            </div>
            <div class="patch-all-banner__desc">
                <div class="patch-all-banner__value">
                    {{ 'imunifyPatch.banner.description' | translate }}
                </div>
                <a [href]="purchaseUrl" target="_blank">
                    <button i360-button [primary]="true">
                        {{ 'imunifyPatch.banner.patchAll' | translate }}
                    </button>
                </a>
            </div>
        </div>
    </div>
    <i360-header>
        {{ 'menu.vulnerabilities' | translate }}
    </i360-header>
    <div *ngIf="showMultiUserTabs$ | async" class="flexer justify-beetween">
        <i360-tabs>
            <a routerLink="users"
               routerLinkActive="active">
                {{ 'imunifyPatch.tabs.users' | translate }}
            </a>
            <a routerLink="files"
               routerLinkActive="active">
                {{ 'imunifyPatch.tabs.files' | translate }}
            </a>
        </i360-tabs>
    </div>
    <router-outlet></router-outlet>
</div>
