<ng-container class="input_group" formGroupName="WORDPRESS">
    <div class="group_name">{{ 'settings.general.wordPress.groupName' | translate }}</div>
    <i360-settings-field *ngIf="hasInstallControl"
                         inputTitle="{{ 'settings.general.wordPress.install.label' | translate }}"
                         description="{{ 'settings.general.wordPress.install.description' | translate }}">
        <mat-checkbox #wpInstallEnable
                      color="primary"
                      data-element="wordpress-security_checkbox"
                      formControlName="security_plugin_enabled">
        </mat-checkbox>
    </i360-settings-field>
    <ng-container *ngIf="wafState$ | async as wafState">
        <i360-settings-field inputTitle="{{ 'settings.general.wordPress.waf.label' | translate }}"
                             description="{{ 'settings.general.wordPress.waf.description' | translate }}"
                             [disabled]="hasInstallControl
                                 ? !installPluginEnabled
                                 : wafState.disabled"
                             [warning]="hasInstallControl
                                 ? adminWafWarning
                                 : wafState.warning">
            <mat-checkbox color="primary"
                          data-element="wordpress-waf_checkbox"
                          formControlName="waf_enabled">
            </mat-checkbox>
        </i360-settings-field>
    </ng-container>
    <i360-settings-field *ngIf="hasWafDefaultControl"
                         inputTitle="{{ 'settings.general.wordPress.wafDefault.label' | translate }}"
                         description="{{ 'settings.general.wordPress.wafDefault.description' | translate }}"
                         [disabled]="!installPluginEnabled || !wafEnabled">
        <mat-checkbox color="primary"
                      data-element="wordpress-waf_default_checkbox"
                      formControlName="waf_default">
        </mat-checkbox>
    </i360-settings-field>
</ng-container>
