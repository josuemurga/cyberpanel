<i360-modal-content
    i360-dialog-template
    [showConfirm]="false"
    [showClose]="false"
    [showCancel]="false">
    <ng-container modal-title>{{ 'settings.general.portLimits.dialog.title' | translate }}</ng-container>
    <ng-container modal-body>
        <i360-port-limits-editor
            [ngModel]="portLimits"
            (ngModelChange)="onPortLimitsChange($event)">
        </i360-port-limits-editor>
    </ng-container>
    <ng-container modal-actions>
        <button mat-button color="primary" type="button"  class="uppercase" (click)="cancel()" [disabled]="saving">
            {{ 'common.cancel' | translate }}
        </button>
        <button mat-button cdkFocusInitial color="primary" class="uppercase" type="button" (click)="apply()" [disabled]="saving">
            {{ 'common.apply' | translate }}
        </button>
    </ng-container>
</i360-modal-content>
