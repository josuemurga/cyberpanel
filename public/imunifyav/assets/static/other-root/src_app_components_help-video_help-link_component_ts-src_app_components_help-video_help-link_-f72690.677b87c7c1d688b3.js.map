<div class="port-limits-editor">
    <form [formGroup]="form">
        <div formArrayName="pairs" class="pairs-container">
            <div *ngFor="let pairGroup of pairs.controls; let i = index"
                 [formGroupName]="i"
                 class="pair-row">
                <div class="field-item">
                    <span class="field-label">{{ 'settings.general.portLimits.port.label' | translate }}</span>
                    <input formControlName="port"
                           [i360Errors]="false"
                           [class.invalid]="submitted && pairGroup.get('port')?.invalid">
                    <span class="field-error" *ngIf="submitted && getError(pairGroup.get('port'))">
                        {{ getError(pairGroup.get('port')) | translate: getErrorParams(pairGroup.get('port')) }}
                    </span>
                </div>
                <div class="field-gap"></div>
                <div class="field-item">
                    <span class="field-label">{{ 'settings.general.portLimits.limit.label' | translate }}</span>
                    <input formControlName="limit"
                           type="number"
                           [i360Errors]="false"
                           [class.invalid]="submitted && pairGroup.get('limit')?.invalid">
                    <span class="field-error" *ngIf="submitted && getError(pairGroup.get('limit'))">
                        {{ getError(pairGroup.get('limit')) | translate: getErrorParams(pairGroup.get('limit')) }}
                    </span>
                </div>
                <button mat-icon-button
                        type="button"
                        class="remove-button"
                        (click)="removePair(i)">
                    <i class="material-icons">delete</i>
                </button>
            </div>
        </div>
        <button mat-raised-button type="button" class="add-button mat-primary" (click)="addPair()">
            {{ (pairs.length === 0 ? 'common.addPort' : 'common.add') | translate }}
        </button>
    </form>
</div>
