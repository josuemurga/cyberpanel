<div class="i360-page-description">{{ 'uam.description' | translate }}</div>

<div class="uam-content"
     i360Loader
     #contentLoader="i360Loader"
     [class.loading]="!loaded">
    <div class="uam-settings"
         i360Loader
         #settingsLoader="i360Loader"
         *ngIf="isAdmin && status">
        <div class="uam-setting">
            <mat-slide-toggle
                    data-element="uam-service-toggle"
                    [checked]="status.enabled"
                    [disabled]="saving"
                    (change)="toggleService($event.source)">
            </mat-slide-toggle>
            <div>
                <div class="uam-setting-title">
                    {{ 'uam.settings.enableService' | translate }}
                </div>
                <div class="uam-setting-description">
                    {{ 'uam.settings.enableServiceDescription' | translate }}
                </div>
            </div>
        </div>

        <div class="uam-settings-divider"></div>

        <div class="uam-setting">
            <mat-slide-toggle
                    data-element="uam-visibility-toggle"
                    [checked]="status.allowed_for_users"
                    [disabled]="saving"
                    (change)="toggleVisibility($event.source)">
            </mat-slide-toggle>
            <div>
                <div class="uam-setting-title">
                    {{ 'uam.settings.allowUsers' | translate }}
                </div>
                <div class="uam-setting-description">
                    {{ 'uam.settings.allowUsersDescription' | translate }}
                </div>
            </div>
        </div>
    </div>

    <webshield-rules *ngIf="loaded"
                     [serviceEnabled]="!!confirmedStatus?.enabled"
                     [warningKey]="warningKey">
    </webshield-rules>
</div>
