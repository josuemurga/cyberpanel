<i360-warning-message *ngIf="!serviceEnabled" [additionalStyles]="['wide']">
    {{ warningKey | translate }}
</i360-warning-message>

<div class="card-container webshield-rules" i360-common-widgets-container *ngIf="serviceEnabled">
    <webshield-test-url [serviceEnabled]="serviceEnabled"
                        (matched)="flashRow($event)">
    </webshield-test-url>

    <div class="webshield-toolbar">
        <div class="webshield-filters">
            <i360-left-widgets-container i360-common-widget>
                <i360-widget i360-search-by
                             *ngIf="isAdmin"
                             title="uam.filters.searchBy"
                             [availableValues]="filterFields">
                </i360-widget>
                <i360-widget i360-search
                             [hidden]="isAdmin && filterBy !== 'domain'"
                             paramName="domain"
                             placeholder="uam.filters.domainPlaceholder">
                </i360-widget>
                <i360-widget i360-search
                             *ngIf="isAdmin"
                             [hidden]="filterBy !== 'owner'"
                             paramName="owner"
                             placeholder="uam.filters.ownerPlaceholder">
                </i360-widget>
            </i360-left-widgets-container>
        </div>
        <div class="webshield-note">
            <i class="material-icons">info_outline</i>
            <span>{{ 'uam.rulesNote' | translate }}</span>
        </div>
        <button mat-raised-button color="primary"
                class="webshield-add"
                data-element="uam-add-button"
                (click)="openAdd()">
            {{ 'uam.actions.add' | translate | uppercase }}
        </button>
    </div>

    <div [i360-request]="getData" name="">
        <i360-data-view>
            <i360-action icon="remove_red_eye"
                         order="0"
                         [singleOnly]="true"
                         [filter]="{canManage: false}"
                         (perform)="openView($event[0])"
                         title="uam.actions.view">
            </i360-action>
            <i360-action icon="edit"
                         order="1"
                         [singleOnly]="true"
                         [filter]="{canManage: true}"
                         (perform)="openEdit($event[0])"
                         title="uam.actions.edit">
            </i360-action>
            <i360-action icon="delete"
                         order="2"
                         [singleOnly]="true"
                         [filter]="{canManage: true}"
                         (perform)="remove($event[0])"
                         title="uam.actions.delete">
            </i360-action>
            <i360-table i360-main-view idName="id" class="fixedLayout">
                <ng-container emptyMessage>
                    <span class="text-uppercase" translate>utils.table.noResultFound</span>
                </ng-container>
                <i360-column [width]="70" headerText="uam.table.headers.id">
                    <span *i360HostTemplate="let item" [attr.data-rule-id]="item.id">
                        {{ item.id }}
                    </span>
                </i360-column>
                <i360-column [width]="120" headerText="uam.table.headers.active">
                    <ng-template i360HostTemplate let-item>
                        <span [matTooltip]="isRowLocked(item)
                                  ? ('uam.tooltips.notOwner' | translate) : ''">
                            <mat-slide-toggle
                                    class="webshield-active-toggle"
                                    [checked]="item.active"
                                    [disabled]="isRowLocked(item) || isRowSaving(item)"
                                    (change)="setActive(item, $event.source.checked)">
                            </mat-slide-toggle>
                        </span>
                    </ng-template>
                </i360-column>
                <i360-column *ngIf="isAdmin" [width]="130" headerText="uam.table.headers.owner">
                    <span *i360HostTemplate="let item">
                        <i360-ellipsis [text]="item.owner"></i360-ellipsis>
                    </span>
                </i360-column>
                <i360-column headerText="uam.table.headers.domain">
                    <span *i360HostTemplate="let item">
                        <i360-ellipsis [text]="item.domain"></i360-ellipsis>
                    </span>
                </i360-column>
                <i360-column [width]="120" headerText="uam.table.headers.cookieTtl">
                    <span *i360HostTemplate="let item">{{ item.cookieTtl }}</span>
                </i360-column>
                <i360-column [width]="200">
                    <div *i360HostTemplate="'header'" class="webshield-hits-header">
                        {{ 'uam.table.headers.hits' | translate }}
                        <mat-form-field appearance="outline"
                                        class="i360-select i360-select--centered
                                               webshield-hits-period">
                            <mat-select [value]="since"
                                        (selectionChange)="setSince($event.value)"
                                        panelWidth="auto"
                                        data-element="uam-hits-period-select">
                                <mat-select-trigger>
                                    {{ 'uam.filters.periodsShort.' + since | translate }}
                                </mat-select-trigger>
                                <mat-option *ngFor="let period of periods" [value]="period">
                                    {{ 'uam.filters.periods.' + period | translate }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <span *i360HostTemplate="let item">{{ item.hits }}</span>
                </i360-column>
                <i360-column headerText="uam.table.headers.label">
                    <span *i360HostTemplate="let item">
                        <i360-ellipsis [text]="item.label"></i360-ellipsis>
                    </span>
                </i360-column>
                <i360-actions-column [width]="80"
                                     #actionsColumn
                                     [justifyContent]="actionsColumn.JUSTIFY_END">
                </i360-actions-column>
            </i360-table>
        </i360-data-view>
    </div>
</div>
