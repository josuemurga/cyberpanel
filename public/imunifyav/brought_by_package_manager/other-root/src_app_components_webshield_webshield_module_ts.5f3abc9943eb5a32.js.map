<div class="webshield-test">
    <label class="webshield-test-label" for="uam-test-url">
        {{ 'uam.test.label' | translate }}
    </label>
    <div class="webshield-test-group">
        <div class="webshield-test-controls">
            <div class="webshield-test-input-wrap">
                <input id="uam-test-url"
                       class="webshield-test-input"
                       [class.invalid]="testInvalid"
                       [(ngModel)]="testUrl"
                       (ngModelChange)="onTestUrlChange()"
                       [disabled]="testDisabled"
                       (keyup.enter)="runTest()"
                       placeholder="{{ 'uam.test.placeholder' | translate }}"
                       data-element="uam-test-url-input">
                <button type="button"
                        class="webshield-test-clear"
                        *ngIf="testUrl"
                        [attr.aria-label]="'uam.test.clear' | translate"
                        (click)="clearTest()"
                        data-element="uam-test-clear-button">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
            <button type="button"
                    class="webshield-test-button"
                    [disabled]="testDisabled || !testUrl.trim() || testing"
                    (click)="runTest()"
                    data-element="uam-test-button">
                {{ (testing ? 'uam.test.testing' : 'uam.test.button')
                    | translate | uppercase }}
            </button>
        </div>
        <div class="webshield-test-error"
             *ngIf="testInvalid"
             data-element="uam-test-invalid">
            {{ 'uam.test.invalid' | translate }}
        </div>
    </div>
    <span class="webshield-test-verdict"
          *ngIf="testResult"
          [class.matched]="testResult.verdict === 'match'"
          [class.no-match]="testResult.verdict === 'no-match'"
          data-element="uam-test-verdict">
        <mat-icon *ngIf="testResult.verdict === 'match'">check</mat-icon>
        <mat-icon *ngIf="testResult.verdict !== 'match'">warning</mat-icon>
        <ng-container *ngIf="testResult.verdict === 'match'">
            {{ 'uam.test.match' | translate:{id: testResult.ruleId} }}
            <ng-container *ngIf="testResult.domain">
                &nbsp;·&nbsp;{{ testResult.domain }}
            </ng-container>
        </ng-container>
        <ng-container *ngIf="testResult.verdict === 'no-match'">
            {{ 'uam.test.noMatch' | translate }}
        </ng-container>
    </span>
</div>
