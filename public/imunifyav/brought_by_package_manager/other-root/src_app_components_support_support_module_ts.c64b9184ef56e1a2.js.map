<div class="card-container" i360Loader>
    <div *ngIf="ticketUrl === undefined; else successMessage">
        <ai-support-iframe *ngIf="!iframeLoadingTimeout && !forceUseOldSupportForm"
                           (iframeLoaded)="iframeLoaded()">
        </ai-support-iframe>

        <!-- Show an old support form if the iframe is not loaded -->
        <ng-container *ngIf="iframeLoadingTimeout || forceUseOldSupportForm">
            <i360-header>
                <mat-icon class="support hidden-xs" svgIcon="support"></mat-icon>
                {{ 'support.title' | translate }}
            </i360-header>

            <form class="card-container settings-container col-md-9"
                  [formGroup]="form" (i360Submit)="submit()" [hidden]="ticketUrl">
                <div class="canvas">
                    <div class="input_group">
                        <ng-container>
                            <i360-settings-field inputTitle="{{ 'support.email.title' | translate }}">
                                <input type="text"
                                       class="underline-input"
                                       placeholder="{{ 'support.email.placeholder' | translate }}"
                                       formControlName="email"
                                       name="request[anonymous_requester_email]"
                                       autocomplete="email">
                            </i360-settings-field>
                            <i360-settings-field inputTitle="{{ 'support.subject.title' | translate }}">
                                <input type="text"
                                       class="underline-input"
                                       placeholder="{{ 'support.subject.placeholder' | translate }}"
                                       formControlName="subject">
                            </i360-settings-field>
                            <i360-settings-field inputTitle="{{ 'support.description.title' | translate }}"
                                                 description="{{ 'support.description.description' | translate }}">
                            <textarea class="underline-input"
                                      placeholder="{{ 'support.description.placeholder' | translate }}"
                                      formControlName="description"
                                      autosize></textarea>
                            </i360-settings-field>
                            <i360-settings-field inputTitle="{{ 'support.cln.title' | translate }}"
                                                 description="">
                                <input type="text"
                                       class="underline-input"
                                       placeholder="{{ 'support.cln.placeholder' | translate }}"
                                       formControlName="cln"
                                       name="request[custom_fields][43148369]">
                            </i360-settings-field>
                            <i360-settings-field *ngIf="!panel.isNoPanel" inputTitle="{{ 'support.attachments' | translate }}">
                                <i360-file-uploader formControlName="file"></i360-file-uploader>
                            </i360-settings-field>
                            <i360-settings-field>
                                <div class="tools">
                                    <button id="support-submit" color="primary"  type="submit" mat-raised-button [disabled]="submitted">
                                        {{ 'support.submit' | translate }}
                                    </button>
                                </div>
                            </i360-settings-field>
                        </ng-container>
                    </div>
                </div>
            </form>
        </ng-container>
    </div>

    <ng-template #successMessage>
        <div class="success-message">
            <img [src]="imagePath+'/dog.png'">
            <h3 translate>support.success.title</h3>
            <h4 translate>support.success.subtitle</h4>
            <div *ngIf="ticketUrl; else messageText">
                    <p translate>support.success.link</p>
                    <a href="{{ ticketUrl }}" target="_blank">{{ ticketUrl }}</a>
            </div>
            <ng-template #messageText>
                    <p translate class="i360-severity-text-medium">support.success.checkEmail</p>
            </ng-template>
        </div>
    </ng-template>

</div>
