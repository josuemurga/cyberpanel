<i360-settings-field
        inputTitle="{{ 'settings.notification.fields.adminEmails.label' | translate }}"
        description="{{ 'settings.notification.fields.adminEmails.description'| translate }}">
    <div class="display-flex-column">
        <div class="i360-default-emails">
            <mat-checkbox [checked]="useDefaultEmails"
                          (change)="useDefaultEmailsChange($event.checked)"
                          color="primary">
                {{ 'settings.notification.fields.adminEmails.checkboxTitle' | translate }}
            </mat-checkbox>
        </div>
        <cl-text-input>
            <textarea
                matInput
                cdkTextareaAutosize
                cdkAutosizeMinRows="1"
                cdkAutosizeMaxRows="7"
                [formControl]="adminEmailsControl"
                commaSeparatedInput
                attr.aria-label="{{ 'settings.notification.fields.adminEmails.label' | translate }}">
            </textarea>
        </cl-text-input>
    </div>
</i360-settings-field>
