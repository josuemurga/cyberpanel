<i360-settings-field
        inputTitle="{{ 'settings.notification.fields.runScript.label' | translate }}"
        description="{{ 'settings.notification.fields.runScript.description' | translate }}">
    <cl-text-input>
        <textarea
            matInput
            cdkTextareaAutosize
            cdkAutosizeMinRows="1"
            cdkAutosizeMaxRows="7"
            [formControl]="scriptsControl"
            [splitBy]="SeparatedBy.byEnter"
            commaSeparatedInput>
        </textarea>
    </cl-text-input>
</i360-settings-field>
