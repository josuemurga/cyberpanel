<div i360Loader>
    <ng-container *ngIf="!panel.isPlesk">
        <ng-container *ngIf="featuresManagementService.native | async as nativeStatus">
            <features-management-native
                    [isMyImunify]="(config.changes|async)?.MY_IMUNIFY.enable"
                    *ngIf="(nativeStatus.enabled || (config.changes|async)?.MY_IMUNIFY.enable) else legacy">
            </features-management-native>
            <ng-template #legacy>
                <features-management-legacy></features-management-legacy>
            </ng-template>
        </ng-container>
    </ng-container>
    <ng-container *ngIf="panel.isPlesk">
        <features-management-native *ngIf="pleskServicePlanEnabled$ | async else legacy"></features-management-native>
        <ng-template #legacy>
            <features-management-legacy></features-management-legacy>
        </ng-template>
    </ng-container>
</div>
