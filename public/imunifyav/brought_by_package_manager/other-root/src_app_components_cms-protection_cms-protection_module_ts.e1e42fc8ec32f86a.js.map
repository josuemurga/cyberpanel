<i360-modal-content [confirmText]="'dashboard.incidents.modal.confirmText'"
                    [showConfirm]="false"
                    [showCancel]="false">
    <ng-container modal-title>
        {{ 'dashboard.incidents.modal.title' | translate:{plugin: data.ruleToBlock.plugin} }}
    </ng-container>

    <ng-container modal-body>
        <ng-container *ngIf="domains$ | async as domains">
            <div class="rule-domains">
                {{ 'cmsProtection.incidentsModal.areYouSure' | translate }}
                <span class="text-bold">{{ data.ruleToBlock.name }}</span>?
                <ng-container *ngIf="domains.length > 1">
                    <br>
                    {{ 'cmsProtection.incidentsModal.disableWarning' | translate }}
                </ng-container>
            </div>
            <i360-warning-message *ngIf="isWordpressPlugin">
                {{ 'cmsProtection.wpDelayNotice' | translate }}
            </i360-warning-message>
            <mat-form-field appearance="outline"
                            class="i360-select i360-select--centered"
                            *ngIf="domains.length > 1">
                <mat-select [formControl]="domainsControl"
                            placeholder="{{ 'cmsProtection.incidentsModal.selectDomains' | translate }}"
                            multiple>
                    <mat-option *ngFor="let domain of domains" [value]="domain">
                        {{ domain }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </ng-container>
    </ng-container>

    <ng-container modal-actions>
        <button mat-button
                color="primary"
                type="button"
                class="uppercase"
                (click)="dialogRef.close()">
            {{ 'common.cancel' | translate }}
        </button>
        <button mat-button
                cdkFocusInitial
                color="primary"
                class="uppercase"
                type="button"
                (click)="onConfirm()">
            {{ 'dashboard.incidents.modal.confirmText' | translate }}
        </button>
    </ng-container>
</i360-modal-content>
