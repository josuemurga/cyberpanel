<i360-header>
    {{ 'cmsProtection.title' | translate }}
</i360-header>
<i360-tabs class="cms-protection__tabs">
    <a *ngIf="isTabAllowed(CMS_PROTECTION_TABS.Incidents)"
       [routerLink]="CMS_PROTECTION_TABS.Incidents"
       routerLinkActive="active">{{ 'cmsProtection.incidents' | translate }}</a>
    <a *ngIf="isTabAllowed(CMS_PROTECTION_TABS.DisabledRules)"
       [routerLink]="CMS_PROTECTION_TABS.DisabledRules"
       routerLinkActive="active">{{ 'cmsProtection.disabledRules.title' | translate }}</a>
</i360-tabs>
<router-outlet></router-outlet>
