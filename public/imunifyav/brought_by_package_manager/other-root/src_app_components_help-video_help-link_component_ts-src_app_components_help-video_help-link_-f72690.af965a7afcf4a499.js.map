<i360-modal-content
    [showConfirm]="false">
    <ng-container modal-title>
        {{ data.title || ('utils.modals.fileViewer.title' | translate: {path: data.path}) }}
    </ng-container>
    <ng-container modal-subtitle  *ngIf="data?.subTitle">
            {{ data.subTitle }}
    </ng-container>
    <ng-container modal-body>
        <div *ngIf="data?.diff" class="flexer tabs">
            <ng-container *ngFor="let tab of tabs">
                <div class="tab"
                     [class.active]="activeTab === tab"
                     (click)="switchTab(tab)">
                    <span>{{ ('malware.malicious.view.tabs.' + tab) | translate }}</span>
                </div>
            </ng-container>
        </div>
        <ng-container *ngIf="activeTab === 'content'; else diffContent">
            <label *ngIf="data.limit < data.size" for="file-viewer">
                {{ 'utils.modals.fileViewer.shownFirst' | translate: {size: data.limit / 1024} }}
            </label>
            <textarea id="file-viewer" readonly>{{ data.chunk }}</textarea>
        </ng-container>
        <ng-template #diffContent>
            <i360-diff-viewer [fileName]="data.path" [decodedDiff]="data?.diff"></i360-diff-viewer>
        </ng-template>
    </ng-container>
</i360-modal-content>
