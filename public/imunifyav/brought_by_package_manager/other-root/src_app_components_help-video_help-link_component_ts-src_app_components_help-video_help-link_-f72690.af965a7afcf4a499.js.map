<div class="i360-header-section">
    <ng-content select="i360-header"></ng-content>
    <ng-content select="i360-refresher"></ng-content>
    <ng-content select="i360-bulk-actions-wrapper"></ng-content>
    <ng-content select="[i360-add-item-form]"></ng-content>
    <ng-content select="[right-button]"></ng-content>
    <!--TODO: make them type of widget-->
</div>
<div class="top-right-widgets">
    <ng-template *ngFor="let widget of topRightWidgets" [ngTemplateOutlet]="widget.templates.header">
    </ng-template>
</div>

<div class="flexer align-center"
     *ngIf="topWidgets?.length || checkboxColumn || tableComponent?.columnsConfiguration">

    <i360-left-widgets #leftWidgets [widgets]="topWidgets"></i360-left-widgets>

    <div class="multiple_action" [class.button-action]="isActionButton">
        <ng-container *ngIf="checkboxColumn">
            <div class="selected-items-text" *ngIf="checkboxColumn.selectedItems.length">
                {{ selectedItemsText | translate:{count: checkboxColumn.selectedItems.length} }}
            </div>
            <ng-container *ngFor="let action of actions">
                <ng-template
                        *ngIf="!action.singleOnly && checkboxColumn.selectedItems|filterCount:action.filter"
                             [ngTemplateOutlet]="action.templates.header"
                             [ngTemplateOutletContext]="{items: checkboxColumn.selectedItems,
                             type: 'group'}">
                </ng-template>
            </ng-container>
            <ng-content select="[i360-standalone-actions]"></ng-content>
        </ng-container>
        <ng-container *ngIf="tableComponent?.columnsConfiguration">
            <ng-container *ngTemplateOutlet="tableComponent?.columnsConfiguration.configTemplate"></ng-container>
        </ng-container>
    </div>
</div>
<ng-content select="[i360-main-view-info]"></ng-content>
<ng-content select="[i360-main-view]"></ng-content>
<div class="flexer align-center bottom-widgets">
    <div></div>
    <ng-template *ngFor="let widget of bottomWidgets"
                 [ngTemplateOutlet]="widget.templates.header">
    </ng-template>
</div>
