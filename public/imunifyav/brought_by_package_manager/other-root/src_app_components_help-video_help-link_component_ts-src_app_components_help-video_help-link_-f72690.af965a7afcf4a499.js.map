<div>
     <i360-column-configuration  *ngIf="enableTableConfiguration"
        [columns]="columns"
        [tableName]="tableName"
        (selectedColumn)="fieldConfiguration = $event"
     >
    </i360-column-configuration>
    <table class="table">
        <tr>
            <ng-container *ngFor="let col of columns; let i = index; let last = last">
                <th *ngIf="col.templates.header &&
                ((!col.bodyField || !col.configurable) || ((fieldConfiguration).includes(col.bodyField)))"
                    [attr.colspan]="col.headerColspan"
                    [style.width.px]="col.width"
                    [class]="col.classes">
                        <ng-container i360HeaderTemplateLoader
                                  [column]="col"></ng-container>
                </th>
            </ng-container>
        </tr>

        <tr *i360For="let item of data; trackBy: trackByFn" [i360TableRow]="item">
            <ng-container *ngFor="let col of columns">
                <td
                    *ngIf="(!col.bodyField || !col.configurable) || (fieldConfiguration).includes(col.bodyField)"
                    [style.width.px]="col.width"
                    [class]="col.classes">
                    <ng-container i360BodyTemplateLoader [column]="col"></ng-container>
                </td>
            </ng-container>
        </tr>
        <tr *ngIf="!data.length && !!columns" class="no_result">
            <td [attr.colspan]="columns.length">
                <span translate [hidden]="customEmptyMessage.hasChildNodes()">
                    utils.table.noResultFound
                </span>
                <div #customEmptyMessage>
                    <ng-content select="[emptyMessage]"></ng-content>
                </div>
            </td>
        </tr>
    </table>
    <ng-container *ngIf="isSimplePaginator && data.length">
        <i360-simple-paginator [data]="data" (changePage)="changeData($event)"></i360-simple-paginator>
    </ng-container>
</div>
