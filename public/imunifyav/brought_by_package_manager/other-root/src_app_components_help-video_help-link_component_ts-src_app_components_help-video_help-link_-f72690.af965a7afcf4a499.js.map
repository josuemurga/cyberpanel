<ng-container class="input_group" formGroupName="WORDPRESS">
    <div class="group_name">{{ 'settings.general.wordPress.groupName' | translate }}</div>
    <i360-settings-field *ngIf="hasInstallControl"
                         inputTitle="{{ 'settings.general.wordPress.install.label' | translate }}"
                         description="{{ 'settings.general.wordPress.install.description' | translate }}">
        <mat-checkbox #wpInstallEnable
                      color="primary"
                      data-element="wordpress-security_checkbox"
                      formControlName="security_plugin_enabled">
        </mat-checkbox>
    </i360-settings-field>
    <ng-container *ngIf="wafState$ | async as wafState">
        <i360-settings-field inputTitle="{{ 'settings.general.wordPress.waf.label' | translate }}"
                             description="{{ 'settings.general.wordPress.waf.description' | translate }}"
                             [disabled]="hasInstallControl
                                 ? !installPluginEnabled
                                 : wafState.disabled"
                             [warning]="hasInstallControl
                                 ? adminWafWarning
                                 : wafState.warning">
            <mat-checkbox color="primary"
                          data-element="wordpress-waf_checkbox"
                          formControlName="waf_enabled">
            </mat-checkbox>
        </i360-settings-field>
    </ng-container>
    <i360-settings-field *ngIf="hasWafDefaultControl"
                         inputTitle="{{ 'settings.general.wordPress.wafDefault.label' | translate }}"
                         description="{{ 'settings.general.wordPress.wafDefault.description' | translate }}"
                         [disabled]="!installPluginEnabled || !wafEnabled">
        <mat-checkbox color="primary"
                      data-element="wordpress-waf_default_checkbox"
                      formControlName="waf_default">
        </mat-checkbox>
    </i360-settings-field>
    <i360-settings-field *ngIf="hasAiBotControl"
                         inputTitle="{{ 'settings.general.wordPress.aiBot.label' | translate }}"
                         description="{{ 'settings.general.wordPress.aiBot.description' | translate }}"
                         [disabled]="hasInstallControl ? !installPluginEnabled : false">
        <mat-checkbox color="primary"
                      data-element="wordpress-ai_bot_protection_checkbox"
                      formControlName="ai_bot_protection">
        </mat-checkbox>
    </i360-settings-field>
    <i360-settings-field *ngIf="hasAiBotPresetControl"
                         inputTitle="{{ 'settings.general.wordPress.aiBot.preset.label' | translate }}"
                         [disabled]="!installPluginEnabled || !aiBotEnabled">
        <mat-form-field>
            <mat-select formControlName="ai_bot_protection_preset"
                        data-element="wordpress-ai_bot_protection_preset_select"
                        [placeholder]="'settings.general.wordPress.aiBot.preset.placeholder' | translate">
                <mat-option value="balanced">
                    {{ 'settings.general.wordPress.aiBot.presets.balanced' | translate }}
                </mat-option>
                <mat-option value="strict">
                    {{ 'settings.general.wordPress.aiBot.presets.strict' | translate }}
                </mat-option>
                <mat-option value="monitor">
                    {{ 'settings.general.wordPress.aiBot.presets.monitor' | translate }}
                </mat-option>
            </mat-select>
        </mat-form-field>
    </i360-settings-field>
    <i360-settings-field *ngIf="hasAiBotDefaultControl"
                         inputTitle="{{ 'settings.general.wordPress.aiBot.default.label' | translate }}"
                         description="{{ 'settings.general.wordPress.aiBot.default.description' | translate }}"
                         [disabled]="!installPluginEnabled || !aiBotEnabled">
        <mat-checkbox color="primary"
                      data-element="wordpress-ai_bot_protection_default_checkbox"
                      formControlName="ai_bot_protection_default">
        </mat-checkbox>
    </i360-settings-field>
</ng-container>
