<i360-experimental-label *ngIf="experimental"></i360-experimental-label>
<label *ngIf="wrapWithLabel; else doNotWrapWithLabelTemplate" class="display-flex-row flex-auto">
    <ng-container *ngTemplateOutlet="content"></ng-container>
</label>
<ng-template #doNotWrapWithLabelTemplate>
    <div class="display-flex-row flex-auto">
        <ng-template [ngTemplateOutlet]="content"></ng-template>
    </div>
</ng-template>

<ng-template #content>
    <div class="title-wrapper i360-settings-title-column">
        <ng-content select="[serial-template]"></ng-content>
        <div class="title">
            {{inputTitle}}
        </div>
        <div i360-description>
            <ng-container *ngIf="descriptions?.length">
                <div *ngFor="let text of descriptions">
                    {{text | allButLastWord}}&nbsp;{{text | lastWord}}
                </div>
            </ng-container>
            <ng-content select="[description]"></ng-content>
        </div>
        <div *ngIf="!!warning" class="warning">
            <settings-warning
                    text="{{ warning | translate }}"
                    [more]="!warningMoreNewLine ? warningMoreLink : ''"
                    [moreText]="warningMoreText">
            </settings-warning>
             <div placement="bottom"
                  *ngIf="warningMoreNewLine"
                 [matTooltipDisabled]="!overflowDetector.overflow"
                 [matTooltip]="warningMoreText | translate">
                 <a #overflowDetector="i360OverflowDetector"
                    [href]="warningMoreLink"
                    target="_blank"
                    class="i360-warning-more-new-line"
                    [i360OverflowDetector]="warningMoreText | translate">
                     {{warningMoreText | translate}}
                 </a>
            </div>
        </div>
        <ng-content select="[preset-template]"></ng-content>
    </div>
    <div class="control-wrapper i360-settings-value-column">
        <ng-content></ng-content>
    </div>
</ng-template>
