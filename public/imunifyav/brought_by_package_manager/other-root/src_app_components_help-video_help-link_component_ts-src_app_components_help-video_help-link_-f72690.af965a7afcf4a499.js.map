<i360-modal-content confirmText="table.confirmDialog">
    <ng-container modal-title>
        {{ 'table.dialogTitle' | translate }}
    </ng-container>
    <div modal-body>
        <div  class="i360-field-group">
            <form [formGroup]="form">
                <ng-container *ngFor="let column of data.allColumns; let i = index">
                    <div class="flexer" *ngIf="!!column.bodyField" >
                        <div class="i360-control-wrapper">
                            <mat-checkbox
                                [matTooltip]="!column.configurable ? ('table.importantFields' | translate ): ''"
                                [disabled]="data.selected.includes(column.bodyField)"
                                [formControlName]="column.bodyField">
                                <span>{{ column.headerText | translate }}</span>
                            </mat-checkbox>
                        </div>
                    </div>
                </ng-container>
            </form>
        </div>

    </div>
</i360-modal-content>
