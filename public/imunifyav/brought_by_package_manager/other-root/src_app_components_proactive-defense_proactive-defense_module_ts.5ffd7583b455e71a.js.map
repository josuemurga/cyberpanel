<i360-header [subheader]="'pd.subtitle' | translate">
  {{ 'pd.title' | translate }}
</i360-header>
<i360-protection-status *ngIf="myImunifyState?.enabled"
                        class="proactive-defense__protection-status"
                        [isEnabledProtection]="myImunifyState.protection"
                        [maliciousCount]="maliciousCount"
                        [maliciousFixed]="maliciousFixed"
></i360-protection-status>
<i360-mode></i360-mode>
<i360-tabs class="proactive-defense__tabs">
  <a *ngIf="isTabAllowed(PROACTIVE_DEFENCE_TABS.Events)"
     [routerLink]="PROACTIVE_DEFENCE_TABS.Events"
     routerLinkActive="active"
     translate>pd.navigation.detectedEvents</a>
  <a *ngIf="isTabAllowed(PROACTIVE_DEFENCE_TABS.IgnoreList)"
     [routerLink]="PROACTIVE_DEFENCE_TABS.IgnoreList"
     routerLinkActive="active"
     translate>pd.navigation.ignoreList</a>
</i360-tabs>
<router-outlet></router-outlet>
